name: Cập nhật website Canvas

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: canvas-website
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Chuẩn bị website tĩnh
        run: |
          mkdir -p site/assets
          cp liblib-canvas-web/index.html liblib-canvas-web/app.js liblib-canvas-web/style.css site/
          cp liblib-canvas-web/assets/* site/assets/
      - name: Cấu hình GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Đóng gói website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Cập nhật website
        id: deploy
        uses: actions/deploy-pages@v4
