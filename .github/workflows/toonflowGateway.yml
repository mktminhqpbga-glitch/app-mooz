name: ToonFlow relay regression

on:
  push:
    branches: [feature/toonflowRelayGateway]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Verify Node syntax
        run: |
          node --check relay-server/server.cjs
          node --check relay-server/toonflowGateway.cjs
      - name: Test legacy MooZ relay and ToonFlow bridge
        run: node --test tests/desktop-outbound-relay.test.cjs tests/desktop-toonflow-relay.test.cjs
